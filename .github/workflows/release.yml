name: Build & Release UNKNW IPA

# Builds UNKNW, injects it into the base Instagram IPA, and publishes the result
# as a GitHub Release. Runs on a version tag push, or manually.
#
# Required repository secret:
#   BASE_IPA_URL   Direct URL to a DECRYPTED Instagram .ipa (cryptid 0).
#                  e.g. https://cdn.scyhost.com/com.burbn.instagram_453.0.ipa
# Optional secret:
#   BASE_IPA_AUTH  A full curl header for auth, e.g. "Authorization: Bearer XXX".

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: false
        default: latest

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      THEOS: ${{ github.workspace }}/theos
      AZULE_DIR: ${{ github.workspace }}/Azule
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip git \
            libxml2 libtinfo6 xz-utils libplist-2.0-4

      - name: Cache theos toolchain + SDK
        id: cache-theos
        uses: actions/cache@v4.2.3
        with:
          path: theos
          key: theos-ios16.5-${{ runner.os }}-v1

      - name: Set up theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: bash scripts/setup-theos.sh

      - name: Clone Azule
        run: git clone --depth 1 https://github.com/Al4ise/Azule "$AZULE_DIR"

      - name: Download base Instagram IPA
        id: dl
        continue-on-error: true
        env:
          BASE_IPA_URL: ${{ secrets.BASE_IPA_URL }}
          BASE_IPA_AUTH: ${{ secrets.BASE_IPA_AUTH }}
          BASE_RELEASE_TAG: ig-v453
          BASE_ASSET_NAME: com.burbn.instagram_453.0.ipa.ipa
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ipa
          LOG=ipa/_dl.log
          {
            echo "==== diagnostics $(date -u) ===="
            echo "gh: $(gh --version 2>&1 | head -1)"; echo "curl: $(curl --version 2>&1 | head -1)"
            echo "disk:"; df -h . ; echo "proxy env:"; env | grep -iE 'proxy|CA_BUNDLE|CURL_CA' || echo none
            echo "resolve asset id:"
            AID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$BASE_RELEASE_TAG" --jq ".assets[] | select(.name==\"$BASE_ASSET_NAME\") | .id" 2>&1)
            echo "  asset id=[$AID]"
            echo "==== attempt A: gh release download ===="
            gh release download "$BASE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$BASE_ASSET_NAME" --dir ipa --clobber 2>&1 \
              && mv "ipa/$BASE_ASSET_NAME" ipa/instagram.ipa && echo "  A ok" || echo "  A failed rc=$?"
            if [ ! -s ipa/instagram.ipa ]; then
              echo "==== attempt B: curl api asset octet-stream (verbose headers) ===="
              curl -sS -L -D - -o ipa/instagram.ipa -w "\n  http=%{http_code} size=%{size_download} url=%{url_effective}\n" \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$AID" 2>&1 | sed 's/Bearer .*/Bearer ***/' | head -40
            fi
            if [ ! -s ipa/instagram.ipa ]; then
              echo "==== attempt C: curl browser_download_url ===="
              BURL=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$BASE_RELEASE_TAG" --jq ".assets[] | select(.name==\"$BASE_ASSET_NAME\") | .browser_download_url" 2>&1)
              echo "  burl=$BURL"
              curl -sS -L -D - -o ipa/instagram.ipa -w "\n  http=%{http_code} size=%{size_download}\n" "$BURL" 2>&1 | head -40
            fi
            echo "==== result ===="; ls -la ipa; echo "head:"; head -c4 ipa/instagram.ipa 2>/dev/null | od -An -tx1
          } > "$LOG" 2>&1 || true
          cat "$LOG"
          SIG=$(head -c4 ipa/instagram.ipa 2>/dev/null | od -An -tx1 | tr -d ' ')
          case "$SIG" in 504b*) echo "ok=true" >> "$GITHUB_OUTPUT" ;; *) echo "ok=false" >> "$GITHUB_OUTPUT" ;; esac

      - name: Publish download diagnostics (always, so it is readable)
        if: always() && steps.dl.outputs.ok != 'true'
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: ci-debug
          name: CI debug
          files: ipa/_dl.log

      - name: Fail if base IPA missing
        if: steps.dl.outputs.ok != 'true'
        run: echo "::error::base IPA download failed; see ci-debug release _dl.log" && exit 1

      - name: Clean base (neutralize pre-injected tweak, keep binary intact)
        run: |
          chmod +x scripts/de-regram.sh scripts/setup-theos.sh
          scripts/de-regram.sh ipa/instagram.ipa ipa/clean.ipa

      - name: Build + inject
        id: build
        continue-on-error: true
        run: |
          chmod +x package-ipa.sh
          mkdir -p packages
          set -o pipefail
          # Original: Regram stripped out, UNKNW injected into the clean base.
          ./package-ipa.sh ipa/clean.ipa packages/UNKNW-Gram.ipa 2>&1 | tee packages/_build.log
          # Diagnostic/interim: Regram LEFT INTACT, UNKNW injected alongside it.
          # If this one is stable but UNKNW-Gram.ipa is not, the de-regram step
          # (removing Regram's enabler fixes) is the cause.
          ./package-ipa.sh ipa/instagram.ipa packages/UNKNW-Gram-REGRAM.ipa 2>&1 | tee -a packages/_build.log
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Publish build log on failure (readable)
        if: always() && steps.build.outputs.ok != 'true'
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: ci-debug
          name: CI debug
          files: packages/_build.log

      - name: Fail if build did not produce the IPA
        if: steps.build.outputs.ok != 'true'
        run: echo "::error::build failed; see ci-debug release _build.log" && exit 1

      - name: Publish release
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: ${{ github.event.inputs.tag || 'latest' }}
          name: UNKNW ${{ github.event.inputs.tag || 'latest' }}
          body: |
            UNKNW injected into Instagram (arm64).
            - `UNKNW-Gram.ipa` — Regram removed, UNKNW only (the product).
            - `UNKNW-Gram-REGRAM.ipa` — Regram kept intact + UNKNW (diagnostic/interim).
            Import into Feather (or another sideloader) and install.
            Two-finger long-press (or long-press the Home tab) opens the UNKNW panel.
          files: |
            packages/UNKNW-Gram.ipa
            packages/UNKNW-Gram-REGRAM.ipa
