name: Build & Release UNKNW IPA

# Builds UNKNW, injects it into the base Instagram IPA, and publishes the result
# as a GitHub Release. Runs on a version tag push, or manually.
#
# Required repository secret:
#   BASE_IPA_URL   Direct URL to a DECRYPTED Instagram .ipa (cryptid 0).
#                  e.g. https://cdn.scyhost.com/com.burbn.instagram_453.0.ipa
# Optional secret:
#   BASE_IPA_AUTH  A full curl header for auth, e.g. "Authorization: Bearer XXX".

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: false
        default: latest

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      THEOS: ${{ github.workspace }}/theos
      AZULE_DIR: ${{ github.workspace }}/Azule
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip git \
            libxml2 libtinfo6 xz-utils libplist-2.0-4

      - name: Cache theos toolchain + SDK
        id: cache-theos
        uses: actions/cache@v4.2.3
        with:
          path: theos
          key: theos-ios16.5-${{ runner.os }}-v1

      - name: Set up theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: bash scripts/setup-theos.sh

      - name: Clone Azule
        run: git clone --depth 1 https://github.com/Al4ise/Azule "$AZULE_DIR"

      - name: Download base Instagram IPA
        env:
          # If BASE_IPA_URL (your CDN) is set, curl it. Otherwise pull the base
          # asset from this repo's release with gh (authenticated; avoids the
          # public release-assets redirect that fails from Actions).
          BASE_IPA_URL: ${{ secrets.BASE_IPA_URL }}
          BASE_IPA_AUTH: ${{ secrets.BASE_IPA_AUTH }}
          BASE_RELEASE_TAG: ig-v453
          BASE_ASSET_NAME: com.burbn.instagram_453.0.ipa.ipa
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ipa
          if [ -n "$BASE_IPA_URL" ]; then
            echo "Fetching base IPA from CDN: $BASE_IPA_URL"
            AUTH=(); [ -n "$BASE_IPA_AUTH" ] && AUTH=(-H "$BASE_IPA_AUTH")
            curl -fL --retry 4 --retry-delay 5 --retry-all-errors "${AUTH[@]}" -o ipa/instagram.ipa "$BASE_IPA_URL"
          else
            echo "Resolving asset '$BASE_ASSET_NAME' on release '$BASE_RELEASE_TAG'"
            ASSET_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$BASE_RELEASE_TAG" \
              --jq ".assets[] | select(.name==\"$BASE_ASSET_NAME\") | .id")
            echo "asset id: $ASSET_ID"
            [ -n "$ASSET_ID" ] || { echo "::error::asset not found"; exit 1; }
            curl -fL --retry 4 --retry-delay 5 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" -o ipa/instagram.ipa
          fi
          ls -la ipa
          head -c4 ipa/instagram.ipa | od -An -tx1   # expect 50 4b (PK zip)

      - name: Clean base (neutralize pre-injected tweak, keep binary intact)
        run: |
          chmod +x scripts/de-regram.sh scripts/setup-theos.sh
          scripts/de-regram.sh ipa/instagram.ipa ipa/clean.ipa

      - name: Build + inject
        run: |
          chmod +x package-ipa.sh
          ./package-ipa.sh ipa/clean.ipa packages/UNKNW-Instagram.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: ${{ github.event.inputs.tag || 'latest' }}
          name: UNKNW ${{ github.event.inputs.tag || 'latest' }}
          body: |
            UNKNW injected into Instagram (arm64).
            Import `UNKNW-Instagram.ipa` into Feather (or another sideloader) and install.
            Two-finger long-press inside Instagram opens the UNKNW panel.
          files: packages/UNKNW-Instagram.ipa
